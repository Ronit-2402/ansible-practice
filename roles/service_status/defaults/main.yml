---
service_status_services_by_server_team :
  RedHat:
    - chronyd
    - sshd
    - crond
  Debian:
    - chrony
    - ssh
    - cron

service_status_services: "{{ service_status_services_by_server_team[ansible_facts['os_family']] | default(service_status_services_by_server_team['RedHat']) }}"

service_status_fail_on_inactive: false
