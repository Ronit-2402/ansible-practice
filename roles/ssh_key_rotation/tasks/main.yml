---
- name: Check that the required variables are provided
  ansible.builtin.assert:
    that:
      - ssh_key_rotation_new_public_key | length > 0
      - ssh_key_rotation_new_private_key_path | length > 0
    fail_msg: "Provide ssh_key_rotation_new_public_key and ssh_key_rotation_new_private_key_path"
    quiet: true
  run_once: true

- name: Check the new private key file on the control node
  ansible.builtin.stat:
    path: "{{ ssh_key_rotation_new_private_key_path }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: ssh_key_rotation_private_stat

- name: Private key must exist and must not be readable by others
  ansible.builtin.assert:
    that:
      - ssh_key_rotation_private_stat.stat.exists
      - ssh_key_rotation_private_stat.stat.mode in ['0600', '0400']
    fail_msg: "Private key is missing or its permission is not 0600/0400"
    quiet: true
  run_once: true

- name: Find the home directory of the target user
  ansible.builtin.getent:
    database: passwd
    key: "{{ ssh_key_rotation_user }}"

- name: Set the paths used in this role
  ansible.builtin.set_fact:
    ssh_key_rotation_ssh_dir: "{{ getent_passwd[ssh_key_rotation_user][4] }}/.ssh"
    ssh_key_rotation_authorized_keys: "{{ getent_passwd[ssh_key_rotation_user][4] }}/.ssh/authorized_keys"
    ssh_key_rotation_backup_file: ""
    ssh_key_rotation_stamp: "{{ ansible_facts['date_time']['iso8601_basic_short'] }}"

- name: Rotate the key with backup, validation and rollback
  become: true
  block:
    - name: Make sure the .ssh directory exists with safe permissions
      ansible.builtin.file:
        path: "{{ ssh_key_rotation_ssh_dir }}"
        state: directory
        owner: "{{ ssh_key_rotation_user }}"
        mode: "{{ ssh_key_rotation_ssh_dir_mode }}"

    - name: Check if authorized_keys already exists
      ansible.builtin.stat:
        path: "{{ ssh_key_rotation_authorized_keys }}"
      register: ssh_key_rotation_ak_stat

    - name: Take a backup of authorized_keys before any change
      ansible.builtin.copy:
        src: "{{ ssh_key_rotation_authorized_keys }}"
        dest: "{{ ssh_key_rotation_authorized_keys }}.bak_{{ ssh_key_rotation_stamp }}"
        remote_src: true
        mode: preserve
      when: ssh_key_rotation_ak_stat.stat.exists

    - name: Remember the backup file name
      ansible.builtin.set_fact:
        ssh_key_rotation_backup_file: "{{ ssh_key_rotation_authorized_keys }}.bak_{{ ssh_key_rotation_stamp }}"
      when: ssh_key_rotation_ak_stat.stat.exists

    - name: Install the new public key (only the public key goes to the server)
      ansible.posix.authorized_key:
        user: "{{ ssh_key_rotation_user }}"
        key: "{{ ssh_key_rotation_new_public_key }}"
        state: present

    - name: Keep safe ownership and permissions on authorized_keys
      ansible.builtin.file:
        path: "{{ ssh_key_rotation_authorized_keys }}"
        owner: "{{ ssh_key_rotation_user }}"
        mode: "{{ ssh_key_rotation_authorized_keys_mode }}"

    - name: Verify that login works with the NEW key
      ansible.builtin.include_tasks: verify_login.yml

    - name: Revoke the old key (only after the new key is verified)
      ansible.posix.authorized_key:
        user: "{{ ssh_key_rotation_user }}"
        key: "{{ ssh_key_rotation_old_public_key }}"
        state: absent
      when: ssh_key_rotation_old_public_key | length > 0

    - name: Verify the NEW key still works after the old key is revoked
      ansible.builtin.include_tasks: verify_login.yml
      when: ssh_key_rotation_old_public_key | length > 0

  rescue:
    - name: Rollback - restore authorized_keys from the backup
      ansible.builtin.copy:
        src: "{{ ssh_key_rotation_backup_file }}"
        dest: "{{ ssh_key_rotation_authorized_keys }}"
        remote_src: true
        mode: preserve
      when: ssh_key_rotation_backup_file | length > 0

    - name: Rollback - remove the new key if there was no authorized_keys before
      ansible.posix.authorized_key:
        user: "{{ ssh_key_rotation_user }}"
        key: "{{ ssh_key_rotation_new_public_key }}"
        state: absent
      when: ssh_key_rotation_backup_file | length == 0

    - name: Stop the job after the rollback
      ansible.builtin.fail:
        msg: "Key rotation failed on {{ inventory_hostname }} and was rolled back: {{ ansible_failed_result.msg | default('unknown') }}"
