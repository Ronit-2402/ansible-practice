---
- name: Report chronyd service status
  hosts: all
  gather_facts: false
  
  tasks:
    - name: Check chronyd service status
      ansible.builtin.command:
        cmd: systemctl is-active chronyd
      register: chronyd_result
      changed_when: false
      failed_when: false
      
    - name: Report the status
      ansible.builtin.debug:
        msg: "The status of chronyd is {{ chronyd_result.stdout }}"
