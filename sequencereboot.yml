---
- name: reboot all servers in sequence 
  hosts: all
  become: true
  gather_facts: false  
  serial: 1
   
  tasks:
    - name: Safe reboot process with checks and logs
      block:
        - name: Check if server is online before reboot
          ansible.builtin.ping:

        - name: Reboot the server
          ansible.builtin.reboot:
            post_reboot_delay: 30
            reboot_timeout: 60

        - name: Verify server is back online after reboot
          ansible.builtin.ping:

        - name: Save success log on server
          ansible.builtin.lineinfile:
            path: "/tmp/reboot_status.log"
            create: yes
            line: "Server {{ inventory_hostname }} rebooted successfully."

      rescue:
        - name: Handle reboot error smoothly
          ansible.builtin.debug:
            msg: "Error: Server {{ inventory_hostname }} failed during reboot or health check."
